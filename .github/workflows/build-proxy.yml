name: Build Proxy (Windows/macOS/Linux)

on:
  push:
    branches: [main]
    paths:
      - "tools/mcp-proxy/**"
  workflow_dispatch:

concurrency:
  group: build-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-exe:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_file: dist/concilium-mcp-proxy.exe
            blob_path: distribuicao/concilium-mcp-proxy.exe
          - os: ubuntu-latest
            dist_file: dist/concilium-mcp-proxy
            blob_path: distribuicao/concilium-mcp-proxy-linux
          - os: macos-latest
            dist_file: dist/concilium-mcp-proxy
            blob_path: distribuicao/concilium-mcp-proxy-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      # tools/mcp-proxy/ é um pacote standalone (pyproject.toml próprio,
      # dependência única declarada: httpx) — empacotado num venv ISOLADO,
      # sem o pacote `concilium` (nem seus extras). Instalar
      # `concilium[sharepoint]` no mesmo venv usado pelo PyInstaller inflava o
      # executável de ~9MB para ~35MB: rich/typer (deps obrigatórias do
      # concilium) já instalados fazem o `try: from ._main import main`
      # opcional do httpx (extra "httpx[cli]") ter sucesso "por acidente",
      # arrastando rich → pygments → PIL/numpy para dentro do bundle sem o
      # proxy nunca os usar. A extração física para tools/mcp-proxy/ torna
      # esse isolamento estrutural, não só uma convenção de venv de build.
      - name: Install proxy build dependencies (isolated venv)
        shell: bash
        run: |
          python -m venv .proxy-build-venv
          # venv do Python cria Scripts/ no Windows e bin/ em Linux/macOS,
          # independente do shell usado para invocar — resolve o caminho certo.
          if [ -f .proxy-build-venv/bin/pip ]; then
            VENV_BIN=.proxy-build-venv/bin
          else
            VENV_BIN=.proxy-build-venv/Scripts
          fi
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          # `pip install --upgrade pip` invocado como pip.exe falha no Windows
          # ("To modify pip, please run ... python.exe -m pip") porque não
          # consegue sobrescrever o próprio executável em uso — `python -m pip`
          # não tem esse problema em nenhum SO.
          "$VENV_BIN/python" -m pip install --upgrade pip
          "$VENV_BIN/python" -m pip install ./tools/mcp-proxy pyinstaller

      - name: Build standalone executable
        shell: bash
        run: |
          "$VENV_BIN/pyinstaller" --onefile --name concilium-mcp-proxy tools/mcp-proxy/proxy.py

      # O binário cru não é mais publicado por SO (ADR-161 F3, sunset do
      # mecanismo antigo) — cada entrada da matrix só sobe seu binário como
      # artifact efêmero (retention curta), para o job pack-mcpb reunir os 3
      # (Windows/Linux/macOS nunca coexistem no filesystem do mesmo runner) e
      # empacotar como .mcpb universal.
      - name: Stage binary for artifact upload
        shell: bash
        run: |
          mkdir -p artifact-staging
          cp "${{ matrix.dist_file }}" "artifact-staging/$(basename '${{ matrix.blob_path }}')"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-binary-${{ matrix.os }}
          path: artifact-staging/
          retention-days: 1

  pack-mcpb:
    name: Empacotar .mcpb universal e publicar versionado
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # merge-multiple funde os 3 artifacts (1 arquivo cada) num único
      # diretório — exatamente o BIN_DIR que tools/mcp-proxy/mcpb/build.sh
      # espera (concilium-mcp-proxy.exe / -linux / -macos lado a lado).
      - name: Download proxy binaries (Windows/Linux/macOS)
        uses: actions/download-artifact@v4
        with:
          pattern: proxy-binary-*
          path: proxy-bins
          merge-multiple: true

      # ubuntu-latest hospedado pela GitHub já vem com Node/npx — o CLI
      # oficial @anthropic-ai/mcpb (usado por build.sh via npx) não precisa
      # de setup adicional.
      - name: Build .mcpb universal
        run: bash tools/mcp-proxy/mcpb/build.sh proxy-bins concilium-mcp-proxy.mcpb

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Instalação separada — só para o `concilium ops blob put-versioned`
      # abaixo, não entra no pacote .mcpb.
      - name: Install publish dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[sharepoint]"

      # Versionado (ADR-161 F3): grava distribuicao/concilium-mcp-proxy/vN.mcpb
      # (imutável) e distribuicao/concilium-mcp-proxy/latest.mcpb (ponteiro
      # estável, sobrescrito) — o link enviado aos usuários (commands_auth.py
      # _get_mcpb_download_url) sempre aponta pro path "latest".
      - name: Publish versioned .mcpb to blob storage
        env:
          # Console legado do Windows (codepage cp1252) não decodifica os símbolos
          # Unicode (✓, →) que o rich/rprint usa no output — força UTF-8 no stdout
          # independente do codepage do runner.
          PYTHONUTF8: "1"
          # A CLI valida config_root no startup (mesmo para comandos que não usam
          # catálogo, como "blob put-versioned") — sem isso, "pip install ."
          # (não-editável) resolve a raiz a partir do local de instalação do
          # pacote, não do checkout.
          CONCILIUM__CONFIG_ROOT: ${{ github.workspace }}/config
          # Mesmo backend usado em produção pelo concilium-mcp/concilium-api
          # (provision.sh) — reaproveita o SharePoint já contratado, sem gerar
          # custo novo de Azure Blob/S3.
          CONCILIUM__STORE_BACKEND: sharepoint
          CONCILIUM__SP_TENANT_ID: ${{ secrets.CONCILIUM__SP_TENANT_ID }}
          CONCILIUM__SP_CLIENT_ID: ${{ secrets.CONCILIUM__SP_CLIENT_ID }}
          CONCILIUM__SP_CLIENT_SECRET: ${{ secrets.CONCILIUM__SP_CLIENT_SECRET }}
          CONCILIUM__SP_DRIVE_ID: ${{ secrets.CONCILIUM__SP_DRIVE_ID }}
          CONCILIUM__SP_ROOT_PATH: ${{ vars.CONCILIUM__SP_ROOT_PATH }}
          # distribuicao/ é dado de sistema, isolado do Drive de projetos (ver
          # SharePointSettings.system_drive_id) — vazio até o site dedicado ser
          # provisionado, caindo para o mesmo Drive/root_path de hoje.
          CONCILIUM__SP_SYSTEM_DRIVE_ID: ${{ secrets.CONCILIUM__SP_SYSTEM_DRIVE_ID }}
          CONCILIUM__SP_SYSTEM_ROOT_PATH: ${{ vars.CONCILIUM__SP_SYSTEM_ROOT_PATH }}
        run: |
          concilium ops blob put-versioned --system concilium-mcp-proxy.mcpb distribuicao/concilium-mcp-proxy
