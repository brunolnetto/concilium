name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formalism-reference:
    name: Formalism Reference (independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately do not install concilium, the MCP SDK, or any runtime
      # dependencies: golden reference evidence must be independently runnable.
      - name: Install reference test runner
        run: python -m pip install "pytest>=9.0.3,<10"

      - name: Verify exact-decimal reference vectors
        run: python -m pytest --confcutdir=tests/reference_formalism tests/reference_formalism -q

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # tools/mcp-proxy/ é standalone (ver comentário no job mcp-proxy) — não
      # há razão para rodar lint/type/test daquele pacote em todo PR/push que
      # não o toca. Fallback: SHA "before" zerado (primeiro push de um branch)
      # ou qualquer erro no git diff conta como mudança, para nunca pular o
      # job por engano.
      - name: Detect changes em tools/mcp-proxy
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qE '^(tools/mcp-proxy/|\.github/workflows/ci\.yml)'; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          else
            echo "proxy=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            mypy \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      - name: Ruff check (strict)
        run: |
          python -m ruff check src/concilium tests --ignore B008

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            'ty==0.0.56' \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      # Dívida #37 zerada — type check agora é bloqueante, cobrindo toda a
      # árvore src/ (inclusive skills/manifests/, Fase 2). Versão pinada no
      # pyproject (dev deps) garante mesmo resultado local e no CI.
      - name: ty
        run: |
          ty check src

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            mypy \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      - name: Run tests (fast profile)
        run: |
          python -m pytest tests -q --tb=short -m "not slow and not flaky" --json-report --json-report-file=.pytest-report.json

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: .pytest-report.json
          if-no-files-found: ignore

  mcp-proxy:
    name: MCP Proxy (standalone)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proxy == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            tools/mcp-proxy/pyproject.toml

      # tools/mcp-proxy/ é um pacote standalone, isolado do resto do monorepo
      # (nunca importa `concilium`) — este job instala SÓ as dependências
      # declaradas em tools/mcp-proxy/pyproject.toml (httpx + dev tooling),
      # nunca `pip install -e .` da raiz. Se alguém reintroduzir um import de
      # `concilium` em proxy.py, este job falha (ImportError), não o CI da raiz.
      - name: Install dependencies (isolated from concilium)
        working-directory: tools/mcp-proxy
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff 'ty==0.0.56'

      - name: Ruff check
        working-directory: tools/mcp-proxy
        run: ruff check .

      - name: ty
        working-directory: tools/mcp-proxy
        run: ty check proxy.py

      - name: Run tests
        working-directory: tools/mcp-proxy
        run: python -m pytest tests -q
