name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  economic-contract-gate:
    name: Economic Contract Evidence (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete PR history for fail-closed comparison
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run negative mutation-contract tests
        run: |
          python -m pip install "pytest>=9.0.3,<10"
          python -m pytest --confcutdir=tests/reference_formalism \
            tests/reference_formalism/test_p25c_required_evidence_gate.py -q

      # Proves the *real CI command* fails on a corrupt golden rather than
      # merely testing a Python helper's return value. Restore before exit.
      - name: Prove corrupted golden blocks reference CI, then restore
        shell: bash
        run: |
          set -euo pipefail
          vector="tests/reference_formalism/vectors/economic_reconciliation_v1.json"
          trap 'git restore -- "$vector"' EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("tests/reference_formalism/vectors/economic_reconciliation_v1.json")
          fixture = json.loads(source.read_text(encoding="utf-8"))
          witness = fixture["vectors"][0]["expected"]["totals"]
          assert witness["K"] == "250", "Versioned baseline changed: audit before mutation"
          witness["K"] = "0"  # Deliberate, never committed: loses paid active/idle
          source.write_text(json.dumps(fixture, indent=2) + "\n", encoding="utf-8")
          PY
          if python -m pytest --confcutdir=tests/reference_formalism \
            tests/reference_formalism/test_p22c_economic_oracle.py -q \
            > /tmp/concilium-golden-mutation.log 2>&1; then
            echo "::error::Corrupt economic golden unexpectedly passed independent oracle."
            exit 1
          fi
          if ! grep -q 'economic golden mismatch' /tmp/concilium-golden-mutation.log; then
            echo "::error::Golden mutation failed for an unexpected reason."
            tail -n 35 /tmp/concilium-golden-mutation.log
            exit 1
          fi
          echo "Expected reference failure detected: golden mutation rejected."
          git restore -- "$vector"
          python -m pytest --confcutdir=tests/reference_formalism \
            tests/reference_formalism/test_p22c_economic_oracle.py -q

      - name: Require normative and golden evidence for economic changes
        # Also audit direct pushes, since branch protection may be unavailable
        # for the private repository. A failed main CI is an alert, not a block
        # on an already accepted direct push.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/formalism_contract_change_gate.py \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  formalism-reference:
    name: Formalism Reference (independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Deliberately do not install concilium, the MCP SDK, or any runtime
      # dependencies: golden reference evidence must be independently runnable.
      - name: Install reference test runner
        run: python -m pip install "pytest>=9.0.3,<10"

      - name: Verify exact-decimal reference vectors
        run: python -m pytest --confcutdir=tests/reference_formalism tests/reference_formalism -q

  formalism-reference-cross-version:
    name: Formalism Reference Py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # No production package, scheduler, finance or other runtime imports.
      - name: Install isolated reference runner
        run: python -m pip install "pytest>=9.0.3,<10"

      - name: Verify deterministic exact golden vectors
        run: python -m pytest --confcutdir=tests/reference_formalism tests/reference_formalism -q

  lockfile:
    name: Dependency Lock (Docker parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv resolver
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Verify lockfile matches pyproject and resolves
        run: uv lock --check

      - name: Verify production dependency install without project
        run: uv sync --locked --no-install-project --no-dev

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # tools/mcp-proxy/ é standalone (ver comentário no job mcp-proxy) — não
      # há razão para rodar lint/type/test daquele pacote em todo PR/push que
      # não o toca. Fallback: SHA "before" zerado (primeiro push de um branch)
      # ou qualquer erro no git diff conta como mudança, para nunca pular o
      # job por engano.
      - name: Detect changes em tools/mcp-proxy
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qE '^(tools/mcp-proxy/|\.github/workflows/ci\.yml)'; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          else
            echo "proxy=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            mypy \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      - name: Ruff check (strict)
        run: |
          python -m ruff check src/concilium tests --ignore B008

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            'ty==0.0.56' \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      # Dívida #37 zerada — type check agora é bloqueante, cobrindo toda a
      # árvore src/ (inclusive skills/manifests/, Fase 2). Versão pinada no
      # pyproject (dev deps) garante mesmo resultado local e no CI.
      - name: ty
        run: |
          ty check src

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            ruff \
            mypy \
            pytest \
            pytest-json-report \
            pytest-asyncio \
            pytest-cov \
            requests \
            httpx \
            jmespath \
            import-linter

      - name: Run tests (fast profile)
        run: |
          python -m pytest tests -q --tb=short -m "not slow and not flaky" --json-report --json-report-file=.pytest-report.json

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: .pytest-report.json
          if-no-files-found: ignore

  mcp-proxy:
    name: MCP Proxy (standalone)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proxy == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            tools/mcp-proxy/pyproject.toml

      # tools/mcp-proxy/ é um pacote standalone, isolado do resto do monorepo
      # (nunca importa `concilium`) — este job instala SÓ as dependências
      # declaradas em tools/mcp-proxy/pyproject.toml (httpx + dev tooling),
      # nunca `pip install -e .` da raiz. Se alguém reintroduzir um import de
      # `concilium` em proxy.py, este job falha (ImportError), não o CI da raiz.
      - name: Install dependencies (isolated from concilium)
        working-directory: tools/mcp-proxy
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio ruff 'ty==0.0.56'

      - name: Ruff check
        working-directory: tools/mcp-proxy
        run: ruff check .

      - name: ty
        working-directory: tools/mcp-proxy
        run: ty check proxy.py

      - name: Run tests
        working-directory: tools/mcp-proxy
        run: python -m pytest tests -q
