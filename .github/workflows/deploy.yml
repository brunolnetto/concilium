name: Build -> ACA Revisions Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag existente no ACR para re-deploy (vazio = build nova)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# Serializa deploys: pushes/merges em sequência rápida em `main` disparavam runs
# paralelas contra o mesmo Container App, causando
# ContainerAppOperationInProgress (Azure só permite uma operação de
# provisionamento por vez). cancel-in-progress=false pois um deploy em
# andamento nunca deve ser cancelado no meio (revision/tráfego inconsistente) —
# runs subsequentes esperam na fila e fazem deploy do commit que as disparou.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
# ── Job 1: Build & Push ───────────────────────────────────────────────────────
  build:
    name: Build & Push → ACR
    uses: ./.github/workflows/_run-deploy-command.yml
    secrets: inherit
    with:
      command: |
        if [[ -n "${{ inputs.image_tag }}" ]]; then
          cd/scripts/deploy.sh image --tag "${{ inputs.image_tag }}"
        else
          cd/scripts/deploy.sh image
        fi



# ── Job 2: Deploy nova revision ACA (sem promover tráfego) ───────────────────
  deploy-revision:
    name: Deploy -> Nova Revision
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: build
    secrets: inherit
    with:
      command: |
        cd/scripts/deploy.sh deploy "${{ needs.build.outputs.image_tag }}"

# ── Job 3: Smoke tests contra a nova revision ────────────────────────────────
  smoke:
    name: Smoke Tests -> Revision '${{ needs.deploy-revision.outputs.deployed_revision }}'
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: [build, deploy-revision]
    secrets: inherit
    with:
      command: |
        sleep 30
        cd/scripts/deploy.sh smoke --revision "${{ needs.deploy-revision.outputs.deployed_revision }}"

# ── Job 4a: Promote (smoke passou) ───────────────────────────────────────────
  promote:
    name: Promote -> Produção
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: [build, deploy-revision, smoke]
    if: needs.smoke.result == 'success'
    secrets: inherit
    with:
      command: |
        cd/scripts/deploy.sh promote --revision "${{ needs.deploy-revision.outputs.deployed_revision }}"
        cd/scripts/deploy.sh status

# ── Job 4b: Rollback (smoke falhou) ──────────────────────────────────────────
  rollback:
    name: Rollback -> Manter Produção Atual
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: [deploy-revision, smoke]
    if: failure() && needs.smoke.result == 'failure'
    secrets: inherit
    with:
      command: |
        if [[ -n "${{ needs.deploy-revision.outputs.active_revision }}" ]]; then
          cd/scripts/deploy.sh rollback --revision "${{ needs.deploy-revision.outputs.active_revision }}"
        else
          echo "::warning::Nenhuma revision ativa anterior encontrada; rollback de trafego ignorado."
        fi
        echo "::error::Smoke tests falharam — rollback executado automaticamente."
        echo "::error::Revision testada: '${{ needs.deploy-revision.outputs.deployed_revision }}'."
        echo "::error::Producao mantida em '${{ needs.deploy-revision.outputs.active_revision }}'."
        exit 1
