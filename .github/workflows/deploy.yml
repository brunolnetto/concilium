name: Build -> ACA Revisions Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag existente no ACR para re-deploy (vazio = build nova)"
        required: false
        default: ""

env:
  REGISTRY:        conciliumacr.azurecr.io
  IMAGE_NAME:      concilium
  RESOURCE_GROUP:  ${{ vars.RESOURCE_GROUP || 'concilium-rg' }}
  LOCATION:        brazilsouth
  ACA_API_APP:     ${{ vars.ACA_API_APP || 'concilium-api' }}
  ACA_MCP_APP:     ${{ vars.ACA_MCP_APP || 'concilium-mcp' }}
  KV_NAME:         concilium-kv

permissions:
  id-token: write
  contents: read

jobs:
# ── Job 1: Build & Push ───────────────────────────────────────────────────────
  build:
    name: Build & Push → ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolver tag da imagem
        id: tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA:0:8}"
            echo "value=${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push via ACR Tasks (cloud build)
        if: inputs.image_tag == ''
        run: |
          az acr login --name conciliumacr
          az acr build \
            --registry conciliumacr \
            --image "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file Dockerfile \
            --platform linux/amd64 \
            .
          echo "✓ Imagem: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"

      - name: Verificar imagem existente (re-deploy)
        if: inputs.image_tag != ''
        run: |
          az acr login --name conciliumacr
          az acr repository show-tags \
            --name conciliumacr \
            --repository "${{ env.IMAGE_NAME }}" \
            --query "[?@=='${{ steps.tag.outputs.value }}']" \
            --output tsv | grep -q . || \
            (echo "Tag '${{ steps.tag.outputs.value }}' não existe no ACR" && exit 1)
          echo "✓ Imagem verificada: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"

# ── Job 2: Deploy nova revision ACA (sem promover tráfego) ───────────────────
  deploy-revision:
    name: Deploy -> Nova Revision
    runs-on: ubuntu-latest
    needs: build
    environment: production
    outputs:
      deployed_revision: ${{ steps.revision.outputs.deployed }}
      active_revision:   ${{ steps.active.outputs.current }}

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capturar revision ativa atual
        id: active
        run: |
          CURRENT=$(az containerapp ingress traffic show \
            --name "${{ env.ACA_API_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "sort_by([?weight > \`0\`], &weight)[-1].revisionName" -o tsv 2>/dev/null || true)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Active revision atual: ${CURRENT:-nenhuma}"

      - name: Deploy nova revision ACA
        env:
          IMAGE_TAG:       ${{ needs.build.outputs.image_tag }}
          ACA_API_APP:     ${{ env.ACA_API_APP }}
          ACA_MCP_APP:     ${{ env.ACA_MCP_APP }}
          AZURE_ACCOUNT:   ${{ vars.CONCILIUM__AZURE_ACCOUNT }}
          AZURE_CONTAINER: ${{ vars.CONCILIUM__AZURE_CONTAINER }}
          AZURE_KEY:       ${{ secrets.CONCILIUM__AZURE_KEY }}
          OTEL_ENDPOINT:   ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          CI: "true"
        run: |
          chmod +x cd/scripts/deploy.sh
          cd/scripts/deploy.sh deploy "$IMAGE_TAG"

      - name: Capturar revision deployada
        id: revision
        run: |
          DEPLOYED=$(az containerapp revision list \
            --name "${{ env.ACA_API_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "sort_by(@,&properties.createdTime)[-1].name" -o tsv)
          echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
          echo "Revision deployada: $DEPLOYED"

# ── Job 3: Smoke tests contra a nova revision ────────────────────────────────
  smoke:
    name: Smoke Tests -> Revision '${{ needs.deploy-revision.outputs.deployed_revision }}'
    runs-on: ubuntu-latest
    needs: [build, deploy-revision]

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aguardar estabilização (30s)
        run: sleep 30

      - name: Executar smoke tests exaustivos
        env:
          TARGET_REVISION:     ${{ needs.deploy-revision.outputs.deployed_revision }}
          ACA_API_APP:         ${{ env.ACA_API_APP }}
          ACA_MCP_APP:         ${{ env.ACA_MCP_APP }}
          SMOKE_CLIENT_ID:     ${{ vars.SMOKE_CLIENT_ID || 'smoke-test' }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
          RESOURCE_GROUP:      ${{ env.RESOURCE_GROUP }}
          CI: "true"
        run: |
          chmod +x cd/scripts/deploy.sh
          cd/scripts/deploy.sh smoke --revision "$TARGET_REVISION"

# ── Job 4a: Promote (smoke passou) ───────────────────────────────────────────
  promote:
    name: Promote -> Produção
    runs-on: ubuntu-latest
    needs: [build, deploy-revision, smoke]
    if: needs.smoke.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promover revision '${{ needs.deploy-revision.outputs.deployed_revision }}' -> produção
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          ACA_API_APP:    ${{ env.ACA_API_APP }}
          CI: "true"
        run: |
          chmod +x cd/scripts/deploy.sh
          cd/scripts/deploy.sh promote --revision "${{ needs.deploy-revision.outputs.deployed_revision }}"

      - name: Resumo do deploy
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          ACA_API_APP:    ${{ env.ACA_API_APP }}
        run: |
          chmod +x cd/scripts/deploy.sh
          cd/scripts/deploy.sh status

# ── Job 4b: Rollback (smoke falhou) ──────────────────────────────────────────
  rollback:
    name: Rollback -> Manter Produção Atual
    runs-on: ubuntu-latest
    needs: [deploy-revision, smoke]
    if: needs.smoke.result == 'failure'

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Garantir tráfego na revision ativa anterior
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          ACA_API_APP:    ${{ env.ACA_API_APP }}
          ACTIVE_REVISION: ${{ needs.deploy-revision.outputs.active_revision }}
          CI: "true"
        run: |
          chmod +x cd/scripts/deploy.sh
          if [[ -n "$ACTIVE_REVISION" ]]; then
            cd/scripts/deploy.sh rollback --revision "$ACTIVE_REVISION"
          else
            echo "::warning::Nenhuma revision ativa anterior encontrada; rollback de tráfego ignorado."
          fi

      - name: Notificar falha
        run: |
          echo "::error::Smoke tests falharam — rollback executado automaticamente."
          echo "::error::Revision testada: '${{ needs.deploy-revision.outputs.deployed_revision }}'."
          echo "::error::Produção mantida em '${{ needs.deploy-revision.outputs.active_revision }}'."
          exit 1
