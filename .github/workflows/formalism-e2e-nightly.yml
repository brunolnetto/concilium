name: Formalism E2E (nightly)

# #24 P24-B: the golden RFP falsifiers and metamorphic relations re-run the
# full pipeline once per case (~16 runs), so they live outside the required
# fast profile. The two golden GO runs and the differential stay in the
# required "Tests" job. Budgets: docs/engineering/formalism_p24_e2e.md.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: formalism-e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  golden-e2e:
    name: Golden RFP falsifiers and metamorphic relations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run slow golden E2E suite
        run: |
          python -m pytest -q --tb=short -m slow --durations=25 \
            --junitxml=.golden-e2e.xml \
            tests/integration/pipeline/test_formalism_golden_rfp_e2e.py \
            tests/integration/pipeline/test_formalism_golden_metamorphic.py

      - name: Enforce time budget
        if: always()
        run: |
          python scripts/check_test_budget.py --junit .golden-e2e.xml \
            --max-test-seconds 360 --max-total-seconds 2700

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-e2e-report
          path: .golden-e2e.xml
          if-no-files-found: ignore
