name: Infra -> ACA Platform Deploy

# Dispara quando os templates Bicep mudam OU manualmente para bootstrap inicial
on:
  push:
    branches: [main]
    paths:
      - 'cd/production/bicep/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do deploy manual (ex: bootstrap inicial, rotação de keys)"
        required: false
        default: "deploy manual"

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'concilium-rg' }}
  LOCATION: brazilsouth
  ACA_API_APP: ${{ vars.ACA_API_APP || 'concilium-api' }}
  ACA_MCP_APP: ${{ vars.ACA_MCP_APP || 'concilium-mcp' }}

permissions:
  id-token: write
  contents: read

jobs:
  # ── Valida Bicep antes de deployar ────────────────────────────────────────
  validate:
    name: Validar Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint e validar templates
        run: |
          chmod +x cd/scripts/deploy.sh
          CI=true cd/scripts/deploy.sh bootstrap --validate

  # ── Deploy Bicep ──────────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infraestrutura
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infraestrutura via script
        env:
          STORAGE_ACCOUNT: ${{ vars.CONCILIUM__AZURE_ACCOUNT }}
        run: |
          chmod +x cd/scripts/deploy.sh
          CI=true cd/scripts/deploy.sh bootstrap

  # ── Configurar JWT Keys (só se não existirem) ─────────────────────────────
  setup-jwt-keys:
    name: Setup JWT Keys (se ausentes)
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar e gerar chaves JWT
        run: |
          chmod +x cd/scripts/deploy.sh
          CI=true cd/scripts/deploy.sh keys
