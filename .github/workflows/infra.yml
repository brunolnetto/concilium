name: Infra -> ACA Platform Deploy

# Dispara quando os templates Bicep mudam OU manualmente para bootstrap inicial
on:
  push:
    branches: [main]
    paths:
      - 'cd/production/bicep/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do deploy manual (ex: bootstrap inicial, rotação de keys)"
        required: false
        default: "deploy manual"

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'concilium-rg' }}
  LOCATION: brazilsouth
  ACA_API_APP: ${{ vars.ACA_API_APP || 'concilium-api' }}
  ACA_MCP_APP: ${{ vars.ACA_MCP_APP || 'concilium-mcp' }}

permissions:
  id-token: write
  contents: read

jobs:
  # ── Valida Bicep antes de deployar ────────────────────────────────────────
  validate:
    name: Validar Bicep
    uses: ./.github/workflows/_run-deploy-command.yml
    secrets: inherit
    with:
      command: |
        cd/scripts/deploy.sh bootstrap --validate

  # ── Deploy Bicep ──────────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infraestrutura
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: validate
    secrets: inherit
    with:
      command: |
        cd/scripts/deploy.sh bootstrap

  # ── Configurar JWT Keys (só se não existirem) ─────────────────────────────
  setup-jwt-keys:
    name: Setup JWT Keys (se ausentes)
    uses: ./.github/workflows/_run-deploy-command.yml
    needs: deploy-infra
    secrets: inherit
    with:
      command: |
        cd/scripts/deploy.sh keys
