name: Infra → Bicep Deploy

# Dispara quando os templates Bicep mudam OU manualmente para bootstrap inicial
on:
  push:
    branches: [main]
    paths:
      - 'cd/production/bicep/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do deploy manual (ex: bootstrap inicial, rotação de keys)"
        required: false
        default: "deploy manual"

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'concilium-rg' }}
  LOCATION: brazilsouth

permissions:
  id-token: write
  contents: read

jobs:
  # ── Valida Bicep antes de deployar ────────────────────────────────────────
  validate:
    name: Validar Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint e validar templates
        run: |
          az bicep build --file cd/production/bicep/main.bicep
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file cd/production/bicep/main.bicep \
            --parameters cd/production/bicep/main.bicepparam \
            --parameters opsIdentityPrincipalId="placeholder" \
            --parameters azureStorageKey="placeholder" \
            --output none
          echo "✓ Templates Bicep válidos"

  # ── Deploy Bicep ──────────────────────────────────────────────────────────
  deploy-infra:
    name: Deploy Infraestrutura
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Obter Storage Key
        id: storage
        run: |
          KEY=$(az storage account keys list \
            --account-name "${{ vars.CONCILIUM__AZURE_ACCOUNT }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].value' -o tsv 2>/dev/null || echo "")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Obter Principal ID do App Registration
        id: app
        run: |
          APP_ID=$(az ad app list --display-name "concilium-github-actions" \
            --query '[0].appId' -o tsv)
          PRINCIPAL_ID=$(az ad sp show --id "$APP_ID" --query id -o tsv)
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep (what-if primeiro)
        run: |
          echo "=== What-if (mudanças planejadas) ==="
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file cd/production/bicep/main.bicep \
            --parameters cd/production/bicep/main.bicepparam \
            --parameters "opsIdentityPrincipalId=${{ steps.app.outputs.principal_id }}" \
            ${KEY:+--parameters "azureStorageKey=${{ steps.storage.outputs.key }}"} \
            --output table || true
        env:
          KEY: ${{ steps.storage.outputs.key }}

      - name: Deploy Bicep (apply)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file cd/production/bicep/main.bicep \
            --parameters cd/production/bicep/main.bicepparam \
            --parameters "opsIdentityPrincipalId=${{ steps.app.outputs.principal_id }}" \
            ${KEY:+--parameters "azureStorageKey=${{ steps.storage.outputs.key }}"} \
            --output none
          echo "✓ Infraestrutura deployada"
        env:
          KEY: ${{ steps.storage.outputs.key }}

      - name: Outputs do deployment
        run: |
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name main-deploy \
            --query properties.outputs \
            --output table 2>/dev/null || \
          az deployment group list \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].properties.outputs' \
            --output table

  # ── Configurar JWT Keys (só se não existirem) ─────────────────────────────
  setup-jwt-keys:
    name: Setup JWT Keys (se ausentes)
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar e gerar chaves JWT
        run: |
          chmod +x cd/scripts/deploy.sh
          CI=true cd/scripts/deploy.sh keys
