name: P25 One-time Lockfile Refresh

on:
  push:
    branches:
      - fix/formalism-p25b-ci-accounting-typing-lint
    paths:
      - .github/workflows/p25-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/formalism-p25b-ci-accounting-typing-lint
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Resolve and verify pinned production and development dependencies
        run: |
          uv lock
          uv lock --check
      - name: Commit lockfile (branch-local only)
        run: |
          git add uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "build(lock): regenerate lock after MCP SDK and PyYAML changes"
            git push origin HEAD:refs/heads/fix/formalism-p25b-ci-accounting-typing-lint
          fi
