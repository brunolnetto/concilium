name: Reusable -> Run deploy.sh

on:
  workflow_call:
    inputs:
      command:
        description: "Comando completo para deploy.sh"
        required: true
        type: string
      smoke_client_id:
        description: "Client ID opcional para smoke"
        required: false
        default: "smoke-test"
        type: string
    outputs:
      image_tag:
        description: "Tag de imagem resolvida por deploy.sh image"
        value: ${{ jobs.run.outputs.image_tag }}
      active_revision:
        description: "Revision ativa antes do deploy"
        value: ${{ jobs.run.outputs.active_revision }}
      deployed_revision:
        description: "Revision criada no deploy"
        value: ${{ jobs.run.outputs.deployed_revision }}

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: Run deploy.sh command
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.run_script.outputs.image_tag }}
      active_revision: ${{ steps.run_script.outputs.active_revision }}
      deployed_revision: ${{ steps.run_script.outputs.deployed_revision }}

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Executar deploy.sh
        id: run_script
        env:
          CI: "true"
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'concilium-rg' }}
          ACA_API_APP: ${{ vars.ACA_API_APP || 'concilium-api' }}
          ACA_MCP_APP: ${{ vars.ACA_MCP_APP || 'concilium-mcp' }}
          ACR_NAME: ${{ vars.ACR_NAME || 'conciliumacr' }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME || 'concilium' }}
          AZURE_ACCOUNT: ${{ vars.CONCILIUM__AZURE_ACCOUNT }}
          AZURE_CONTAINER: ${{ vars.CONCILIUM__AZURE_CONTAINER }}
          AZURE_KEY: ${{ secrets.CONCILIUM__AZURE_KEY }}
          OTEL_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          SMOKE_CLIENT_ID: ${{ inputs.smoke_client_id }}
          SMOKE_CLIENT_SECRET: ${{ secrets.SMOKE_CLIENT_SECRET }}
        run: |
          chmod +x cd/scripts/deploy.sh
          cd/scripts/deploy.sh ${{ inputs.command }}