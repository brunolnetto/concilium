[theme]
# MendesLobo Construtora — identidade visual corporativa
base             = "light"
primaryColor     = "#C05C18"   # Laranja queimado — ação principal, destaque
backgroundColor  = "#F7F8FC"   # Azul muito claro — fundo da aplicação
secondaryBackgroundColor = "#FFFFFF"  # Branco — painéis e sidebar
textColor        = "#1A3A5C"   # Azul marinho escuro — texto principal
font             = "sans serif"

[server]
headless           = true
port               = 8501
enableCORS         = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress    = "localhost"
