services:
  api:
    profiles: ["api", "deploy"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.api
    working_dir: /workspace/concilium
    command: concilium-api
    environment:
      CONCILIUM_ROOT: /workspace/concilium
      CONCILIUM_CONFIG_ROOT: /workspace/concilium/config
      CONCILIUM_API_HOST: ${CONCILIUM_API_HOST:-0.0.0.0}
      CONCILIUM_API_PORT: ${CONCILIUM_API_PORT:-8000}
      CONCILIUM_API_RELOAD: "1"
      UV_NO_DEV: "0"
    ports:
      - "${CONCILIUM_API_PORT:-8000}:${CONCILIUM_API_PORT:-8000}"
    # Executa como root em dev para que o ambiente virtual seja mutável (uv add, etc.)
    user: root
    volumes:
      - ./config:/workspace/concilium/config:rw
      - concilium_projects:/workspace/concilium/projetos
      - concilium_benchmark_projects:/workspace/concilium/benchmarks/projetos
      - uv_cache:/root/.cache/uv
    develop:
      watch:
        # Sincroniza código-fonte sem rebuild (uvicorn --reload detecta mudanças)
        - action: sync
          path: ./src
          target: /workspace/concilium/src
          ignore:
            - .venv/
            - __pycache__/
            - "*.pyc"
        # Sincroniza config sem rebuild (catalog, perfis, contextos)
        - action: sync
          path: ./config
          target: /workspace/concilium/config
        # Rebuild completo se dependências mudarem
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: pyproject.toml

  ui:
    profiles: ["ui", "deploy"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.ui
    working_dir: /workspace/concilium
    command: concilium-ui
    environment:
      CONCILIUM_ROOT: /workspace/concilium
      CONCILIUM_CONFIG_ROOT: /workspace/concilium/config
      CONCILIUM_UI_HOST: ${CONCILIUM_UI_HOST:-0.0.0.0}
      CONCILIUM_UI_PORT: ${CONCILIUM_UI_PORT:-8501}
      CONCILIUM_UI_API_BASE_URL: ${CONCILIUM_UI_API_BASE_URL:-http://api:8000}
      CONCILIUM_API_BASE_URL: ${CONCILIUM_API_BASE_URL:-http://api:8000}
      UV_NO_DEV: "0"
    ports:
      - "${CONCILIUM_UI_PORT:-8501}:${CONCILIUM_UI_PORT:-8501}"
    user: root
    depends_on:
      - api
    volumes:
      - ./config:/workspace/concilium/config:rw
      - concilium_projects:/workspace/concilium/projetos
      - concilium_benchmark_projects:/workspace/concilium/benchmarks/projetos
      - uv_cache:/root/.cache/uv
    develop:
      watch:
        - action: sync
          path: ./src
          target: /workspace/concilium/src
          ignore:
            - .venv/
            - __pycache__/
            - "*.pyc"
        - action: sync
          path: ./config
          target: /workspace/concilium/config
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: pyproject.toml

volumes:
  concilium_projects:
  concilium_benchmark_projects:
  uv_cache:
