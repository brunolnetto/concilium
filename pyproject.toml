[project]
name = "concilium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "PyJWT[crypto]>=2.8.0",
    # Native MCP SDK v1 API is used throughout presentation/mcp (FastMCP and request_ctx).
    # Do not upgrade to mcp 2.x before migrating the server, tools, tests and auth middleware.
    "mcp>=1.16,<2",
    "PyYAML>=6.0,<7",  # config loaders and semantic aliases need yaml at runtime
    "highcharts-gantt>=1.7.0",
    "jsonschema>=4.23.0",
    "jmespath>=1.1.0",
    "openpyxl>=3.1.5",
    "pulp>=3.3.0",
    "ortools>=9.0",
    "pydantic>=2.13.3",
    "python-statemachine>=3.0.0",
    "rich>=15.0.0",
    "streamlit>=1.46.0",
    "typer>=0.25.0",
    "uvicorn>=0.35.0",
    "matplotlib>=3.9.0",
    "pydot>=4.0.1",
    "fpdf2>=2.8.0",
    "ortools>=9.15.6755",
    "reportlab>=4.5.1",
    "eule[interval]>=0.1.3",
    # ADR-100: DuckDB catalog query engine (optional — sem ele usa JSON puro)
    "duckdb>=1.0.0",
    # ADR-098: Rate limiting
    "slowapi>=0.1.9",
    # ADR-095: OpenTelemetry observability layer
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    # ADR-134: templates de email (herança + autoescape HTML)
    "jinja2>=3.1.6",
]

[project.scripts]
concilium = "concilium.presentation.main:main"
concilium-mcp = "concilium.presentation.mcp.server:main"
concilium-api = "concilium.presentation.api.app:main"
concilium-ui = "concilium.presentation.ui.launcher:main"
# concilium-mcp-proxy vive em tools/mcp-proxy/ (pacote standalone, isolado das
# dependências pesadas do concilium) — ver tools/mcp-proxy/pyproject.toml.

[project.optional-dependencies]
# ADR-047: SharePoint backend (instalar com: pip install 'concilium[sharepoint]')
sharepoint = [
    "msal>=1.31.0",
    "httpx>=0.28.1",
]

# S3 backend (instalar com: pip install 'concilium[s3]')
s3 = [
    "aioboto3>=13.0.0",
]

# Azure Blob Storage + Key Vault (instalar com: pip install 'concilium[azure]')
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
]

# Google Drive backend (instalar com: pip install 'concilium[gdrive]')
gdrive = [
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
]

[dependency-groups]
dev = [
    "codebase-stats>=0.0.3",
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "jmespath>=1.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "requests>=2.33.1",
    "ruff>=0.14.2",
    "pytest-json-report>=1.5.0",
    "import-linter>=2.11",
    "ty==0.0.94",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv", "build", "dist", "*.egg-info", "__pycache__"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "asyncio: marca testes assíncronos (pytest-asyncio)",
    "integration: testes de integração que requerem infraestrutura",
    "slow: testes lentos (>5s)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]
"tests/unit/application/skills/test_skills.py" = ["E402"]
"tests/unit/application/services/test_application_services_refactor.py" = ["E402"]
"**/theme.py" = ["E501"]  # CSS strings cannot be split across lines

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage"
omit = [
    "src/concilium/presentation/ui/*",
    # Protocol só referenciado sob `if TYPE_CHECKING:` (ver runtime/mixins/execution.py
    # e inputs.py) — nunca importado em runtime, zero footprint de execução real.
    "src/concilium/application/runtime/mixins/_host_protocol.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.importlinter]
root_packages = ["concilium"]
include_external_packages = true

# Domain purity
[[tool.importlinter.contracts]]
name = "Domain isolation"
type = "forbidden"
source_modules = ["concilium.domain"]
forbidden_modules = [
    "concilium.application",
    "concilium.infrastructure",
    "concilium.presentation",
    "sqlalchemy",
    "fastapi",
    "requests",
]

# Application orchestrates
[[tool.importlinter.contracts]]
name = "Application cannot depend on presentation"
type = "forbidden"
source_modules = ["concilium.application"]
forbidden_modules = [
    "concilium.presentation",
]

# FastAPI presentation depends only on application
[[tool.importlinter.contracts]]
name = "Presentation API cannot bypass application"
type = "forbidden"
source_modules = ["concilium.presentation.api"]
forbidden_modules = [
    "concilium.domain",
]
allow_indirect_imports = true
