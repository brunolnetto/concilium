[pytest]
addopts = -p no:anyio
testpaths = tests
norecursedirs = scripts .venv build dist __pycache__ *.egg-info
markers =
    flaky: timing-sensitive tests that may fail under load or on slow CI machines
    slow: tests that take > 1 s; excluded from make test, run via make test-slow
filterwarnings =
    ignore:CONCILIUM__JWT keys not configured:UserWarning
