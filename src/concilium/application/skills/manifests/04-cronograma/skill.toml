[skill]
id = "04-cronograma"
tier = "oltp"
phase = "Planejamento"
gate = true  # ADR-022: falha bloqueia 03, 04, 05, 06 e toda análise downstream
version = "2.0.0"
descricao = "Gera cronograma semanal unificado: manual (input-driven) ou automático (ADR-004 solver)."

[depends_on]
skills = ["01-escopo-e-eap", "02-produtividade-climatica", "03-catalogo-de-recursos"]
canonical_sections = ["eap", "atividades", "activity_dag", "praticabilidade", "recurso_pool"]

[produces]
canonical_section = "cronograma"
validations = ["VAL-CRON-01", "VAL-CRON-02", "VAL-SCHED-01", "VAL-SCHED-02", "VAL-SCHED-03", "VAL-SCHED-04", "VAL-SCHED-05"]

[inputs]
required = []
optional = ["num_equipes_por_item", "algorithm", "heuristics", "top_n", "deadline_weeks", "criticality", "deadline_margin_pct"]

[snapshots]
consumed = ["catalogo"]

[mode]
description = "Dual mode: 'manual_allocation' (if num_equipes_por_item provided) or 'auto_schedule' (ADR-004 solver). Auto-detect at runtime."

[replan_checkpoint]
enabled = true
descricao = "Revisão de cronograma: num_equipes, algorithm, deadline_weeks. Afeta todas as skills downstream."

