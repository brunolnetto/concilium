[skill]
id = "13-assessor-replanejamento"
phase = "Decisão"
version = "1.0.0"
descricao = "Analisa resultado AMARELO/VERMELHO e gera sugestões de replanejamento com checkpoint e delta de margem estimado."

[depends_on]
skills = ["08-consolidacao-financeira", "10-diagnostico-criticidade", "05-equipes-e-alocacao"]
canonical_sections = ["resultado_reconciliado", "resultado", "cost_criticality_report", "conflitos_pico", "indiretos"]

[produces]
canonical_section = "replan_suggestions"
validations = ["VAL-REPLAN-01", "VAL-REPLAN-02"]

[inputs]
required = []
optional = ["meta_margem_alvo"]

[snapshots]
consumed = ["perfil"]

[trigger]
auto_run_when = "resultado.status_margem in ['AMARELO', 'VERMELHO']"

[replan_checkpoint]
enabled = false
