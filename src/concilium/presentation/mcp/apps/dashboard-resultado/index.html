<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financeiro — Concilium</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4/dist/chart.umd.min.js" crossorigin></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; font-size: 13px; }
    .header { background: #1e40af; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .status-bar { padding: 6px 16px; font-size: 11px; background: #fefce8; border-bottom: 1px solid #fef08a; color: #854d0e; display: flex; align-items: center; gap: 6px; }
    .status-bar.connected { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 12px 16px; }
    .card { background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px; }
    .card-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin-bottom: 4px; }
    .card-value { font-size: 20px; font-weight: 700; color: #1e293b; }
    .card-value.green { color: #16a34a; }
    .card-value.red { color: #dc2626; }
    .card-value.amber { color: #d97706; }
    .card-sub { font-size: 10px; color: #64748b; margin-top: 2px; }
    .section { padding: 0 16px 12px; }
    .section-title { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 8px; }
    .chart-container { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; height: 180px; }
    .table-wrap { background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: auto; max-height: 200px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { background: #f8fafc; padding: 6px 8px; text-align: left; font-size: 10px; text-transform: uppercase; color: #64748b; position: sticky; top: 0; }
    td { padding: 5px 8px; border-top: 1px solid #f1f5f9; }
    tr:hover td { background: #f8fafc; }
    .empty { text-align: center; padding: 32px; color: #94a3b8; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 9999px; font-size: 10px; font-weight: 500; }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-amber { background: #fef9c3; color: #a16207; }
    .badge-red { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>
  <div class="header">
    <span>📊</span>
    <h1>Dashboard Financeiro</h1>
    <span style="margin-left:auto;font-size:11px;opacity:.7">ADR-101 F3</span>
  </div>
  <div class="status-bar" id="status-bar">⏳ Aguardando resultado do pipeline...</div>

  <div class="grid" id="kpi-grid">
    <div class="card"><div class="card-label">Custo Direto</div><div class="card-value" id="kpi-direto">—</div></div>
    <div class="card"><div class="card-label">Venda (com BDI)</div><div class="card-value" id="kpi-venda">—</div></div>
    <div class="card"><div class="card-label">Margem</div><div class="card-value" id="kpi-margem">—</div><div class="card-sub" id="kpi-margem-status"></div></div>
    <div class="card"><div class="card-label">Resultado</div><div class="card-value" id="kpi-resultado">—</div></div>
  </div>

  <div class="section">
    <div class="section-title">Composição de Custo</div>
    <div class="chart-container"><canvas id="chart-composicao"></canvas></div>
  </div>

  <div class="section">
    <div class="section-title">Planejamento por Item</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Item</th><th>Qtd</th><th>PU s/BDI</th><th>PU c/BDI</th><th>Subtotal</th></tr></thead>
        <tbody id="plan-tbody"><tr><td colspan="5" class="empty">Nenhum dado ainda</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const fmt = (v, decimals=0) => v == null ? '—' : new Intl.NumberFormat('pt-BR', {
      style: 'currency', currency: 'BRL', maximumFractionDigits: decimals
    }).format(v);
    const pct = v => v == null ? '—' : `${(v * 100).toFixed(1)}%`;

    let chart = null;

    function render(data) {
      const r = data?.resultado;
      if (!r) return;

      const margem = r.margem_liquida ?? r.margem_operacional ?? null;
      const cor = margem == null ? '' : margem >= 0.08 ? 'green' : margem >= 0.04 ? 'amber' : 'red';

      document.getElementById('kpi-direto').textContent = fmt(r.custo?.direto ?? r.custo?.total);
      document.getElementById('kpi-venda').textContent = fmt(r.venda?.total_com_bdi ?? r.venda?.total_custo_plus);
      document.getElementById('kpi-margem').className = `card-value ${cor}`;
      document.getElementById('kpi-margem').textContent = pct(margem);
      document.getElementById('kpi-margem-status').textContent = r.status_margem ?? '';
      document.getElementById('kpi-resultado').textContent = fmt(r.resultado_financeiro);

      // Composição de custo
      const custo = r.custo ?? {};
      const labels = ['MO', 'Equip', 'Diesel', 'Material', 'Indiretos'];
      const values = [custo.mao_obra, custo.equipamentos, custo.diesel ?? custo.combustivel,
                       custo.material, custo.indireto ?? custo.indiretos].map(v => v ?? 0);
      const colors = ['#3b82f6','#8b5cf6','#f59e0b','#10b981','#f43f5e'];

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('chart-composicao'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 10 } } }
        }
      });

      // Planejamento
      const plan = data?.planejamento ?? [];
      const tbody = document.getElementById('plan-tbody');
      tbody.innerHTML = plan.length === 0
        ? '<tr><td colspan="5" class="empty">Sem dados de planejamento</td></tr>'
        : plan.map(p => `<tr>
            <td><strong>${p.item_id}</strong></td>
            <td>${p.quantitativo?.toFixed(0) ?? '—'}</td>
            <td>${fmt(p.preco_unitario?.total, 2)}</td>
            <td>${fmt(p.preco_unitario_com_bdi?.total, 2)}</td>
            <td>${fmt(p.subtotal?.com_bdi?.total)}</td>
          </tr>`).join('');
    }

    window.addEventListener('message', e => {
      const msg = e.data;
      if (!msg || msg.jsonrpc !== '2.0') return;
      if (msg.id === 1 && msg.result) {
        const bar = document.getElementById('status-bar');
        bar.textContent = '✅ Conectado ao host MCP';
        bar.className = 'status-bar connected';
      }
      if (msg.method === 'ui/toolResult') {
        const result = msg.params?.result;
        if (result?.canonical) render(result.canonical);
        else if (result?.resultado) render(result);
        const bar = document.getElementById('status-bar');
        bar.textContent = `✅ Dados recebidos — ${new Date().toLocaleTimeString('pt-BR')}`;
        bar.className = 'status-bar connected';
      }
    });

    window.parent.postMessage({
      jsonrpc: '2.0', id: 1,
      method: 'ui/initialize',
      params: { protocolVersion: '2026-01-26', capabilities: { push: true } }
    }, '*');
  </script>
</body>
</html>
