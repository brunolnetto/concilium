<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Financeiro — Concilium</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4/dist/tailwind.min.css" crossorigin>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="text-center max-w-md">
    <div class="text-5xl mb-4">📊</div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">Dashboard Financeiro</h1>
    <p class="text-sm text-gray-500 mb-6">Cubo analítico interativo com resultado pós skill-08.</p>
    <div id="status" class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-700">
      ADR-101 Fase 3 — em desenvolvimento
    </div>
    <div id="data" class="mt-4 hidden bg-white rounded-xl border p-4 text-left text-xs text-gray-600"></div>
  </div>
  <script>
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || msg.jsonrpc !== '2.0') return;
      if (msg.result) {
        document.getElementById('status').textContent = 'Conectado ao host MCP.';
        document.getElementById('status').className = 'bg-green-50 border border-green-200 rounded-xl p-4 text-sm text-green-700';
      }
      // Handle tool result push
      if (msg.method === 'ui/toolResult') {
        const el = document.getElementById('data');
        el.classList.remove('hidden');
        el.textContent = JSON.stringify(msg.params?.result, null, 2);
      }
    });
    window.parent.postMessage({
      jsonrpc: '2.0', id: 1,
      method: 'ui/initialize',
      params: { protocolVersion: '2026-01-26', capabilities: {} }
    }, '*');
  </script>
</body>
</html>
